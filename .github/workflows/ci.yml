name: CI & Pipeline Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Validate (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run CLI Preflight Validation
        run: |
          python -m email_ingestion.cli validate

      - name: Run Test Suite (pytest)
        run: |
          pytest -v

      - name: Run Live Synthetic Demonstration
        run: |
          python -m email_ingestion.cli demo

      - name: Verify Master Index & HTML Dashboard Generation
        shell: bash
        run: |
          test -f Auto_download_email/INDEX.md
          test -f Auto_download_email/index.html
          grep -q "Master Attachment Index" Auto_download_email/INDEX.md
          grep -q "Master Attachment Catalog" Auto_download_email/index.html
          echo "Master Attachment Index & HTML Catalog verified successfully."

      - name: Verify CLI Search and Stats Commands
        run: |
          python -m email_ingestion.cli search "Quote"
          python -m email_ingestion.cli stats
