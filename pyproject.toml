[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-ingestion-engine"
version = "0.1.0"
description = "Enterprise Automated Email & Attachment Ingestion Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jerome", email = "jerome@example.com" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "puremagic>=1.28",
    "tenacity>=8.2.3",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "click>=8.1.7",
    "pathvalidate>=3.3.1",
    "rapidfuzz>=3.9.0",
    "imapclient>=3.0.1",
    "email-reply-parser>=0.5.12",
]

[project.optional-dependencies]
cloud = [
    "msgraph-sdk>=1.0.0",
    "azure-identity>=1.15.0",
    "google-api-python-client>=2.115.0",
    "google-auth>=2.27.0",
    "google-cloud-pubsub>=2.19.0",
]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
]

[project.scripts]
email-ingestion = "email_ingestion.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
